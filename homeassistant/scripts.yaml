# =========================
# TV SAMSUNG
# =========================

tv_samsung_power:
  alias: TV Samsung Power
  sequence:
    - action: mqtt.publish
      data:
        topic: "smartlab/tv/samsung/set/1"
        payload: "power"

tv_samsung_up:
  alias: TV Samsung Up
  sequence:
